name: Build all exercises

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build every exercise
        run: |
          set -e
          for proj in */*.csproj; do
            echo "== Building $proj"
            dotnet build "$proj" --configuration Release
          done
